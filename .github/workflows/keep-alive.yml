name: Supabase keep-alive

# Free-tier Supabase projects pause after a week of no API activity.
# This replaces the old Vercel cron route — GitHub Actions calls Supabase
# directly, so there's no public endpoint on our own site to protect.
# Queries a real anon-readable table: the /rest/v1/ root returns 401 for
# publishable keys.
on:
  schedule:
    - cron: "0 12 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          # Prefer: count=exact makes PostgREST run a real COUNT(*) query
          # against Postgres, so the ping is database activity rather than
          # just an API-layer hit.
          status=$(curl -s -o response.txt -w '%{http_code}' \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Prefer: count=exact" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/medication_catalog?select=display_name&limit=1")
          echo "Supabase responded with HTTP $status"
          cat response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
