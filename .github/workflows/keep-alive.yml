name: Supabase keep-alive

# Free-tier Supabase projects pause after a week without enough database
# activity. A read-only COUNT(*) via PostgREST did not prevent a pause, so this
# calls the keep_alive_ping() RPC, which writes a heartbeat row (see
# supabase/migrations/20261023000000_keep_alive_heartbeat.sql). It uses only the
# public URL and publishable key; no service-role key is stored in GitHub.
on:
  schedule:
    # Daily, so one skipped or delayed scheduled run can't open a 7-day gap.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write Supabase heartbeat
        run: |
          status=$(curl -s -o response.txt -w '%{http_code}' -X POST \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/rpc/keep_alive_ping")
          echo "Supabase responded with HTTP $status"
          cat response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
